{# The Figma "Meal (camera view)" drawing as one SVG symbol: plate, tavče gravče, bread, tomato, greens. #}
{# Defined once (hidden), then used with <svg><use href="#zMeal"/></svg> in the photo tips cards.   #}
<svg class="d-none" aria-hidden="true" focusable="false">
    <symbol id="zMeal" viewBox="0 0 110 110">
        {# plate and its rim #}
        <circle cx="55" cy="55" r="53" fill="#FFFFFF" stroke="#DCE5D5" stroke-width="1.5"/>
        <circle cx="55" cy="55" r="42" fill="none" stroke="#E7E2D6" stroke-width="1.2"/>
        {# beans with a few white beans on top #}
        <circle cx="44" cy="50" r="21" fill="#9C4A26"/>
        <ellipse cx="37" cy="43" rx="3.4" ry="2.2" fill="#F2DDB8"/>
        <ellipse cx="48" cy="40" rx="3.4" ry="2.2" fill="#F2DDB8"/>
        <ellipse cx="43" cy="52" rx="3.4" ry="2.2" fill="#F2DDB8"/>
        <ellipse cx="52" cy="57" rx="3.4" ry="2.2" fill="#F2DDB8"/>
        <ellipse cx="34" cy="56" rx="3.4" ry="2.2" fill="#F2DDB8"/>
        {# bread #}
        <rect x="64" y="31" width="22" height="18" rx="4" fill="#F3D9A4" stroke="#E2B66B" stroke-width="2.5"/>
        {# tomato, greens and a bit of cheese #}
        <circle cx="68" cy="64" r="6" fill="#E2533A"/>
        <circle cx="78" cy="59" r="5" fill="#E2533A"/>
        <circle cx="63" cy="74" r="6" fill="#8CC56B"/>
        <circle cx="74" cy="74" r="6" fill="#8CC56B"/>
        <circle cx="82" cy="68" r="4" fill="#F4F1EA"/>
    </symbol>
</svg>
