{# The back arrow and the title of a Profile page (Figma: ‹ + Fraunces title). #}
{# Pass back (a URL), back_label and title.                                     #}
<div class="z-auth-header z-profile-head">
    <a class="z-icon-btn" href="{{ back }}" aria-label="{{ back_label }}">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </a>
    <h1>{{ title }}</h1>
</div>
