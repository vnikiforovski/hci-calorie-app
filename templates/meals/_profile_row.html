{# One row of a Profile menu card (Figma "Profile"): icon tile, title, a short line, chevron. #}
{# Pass url, icon (a Bootstrap Icons name), title and line.                                   #}
<li>
    <a class="z-menu-row" href="{{ url }}">
        <span class="z-menu-icon" aria-hidden="true"><i class="bi {{ icon }}"></i></span>
        <span class="z-menu-text">
            <span class="z-menu-title">{{ title }}</span>
            <span class="z-menu-line">{{ line }}</span>
        </span>
        <i class="bi bi-chevron-right z-menu-chevron" aria-hidden="true"></i>
    </a>
</li>
