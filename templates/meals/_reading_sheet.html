{# "How to read this estimate" at the bottom of the summary card on Result, Meal detail and Saved meal opens this. #}
<div class="offcanvas offcanvas-bottom z-sheet" tabindex="-1" id="readingSheet" aria-labelledby="readingTitle">
    <div class="z-sheet-handle" aria-hidden="true"></div>
    <div class="z-sheet-title">
        <h2 class="mb-0" id="readingTitle">How to read this</h2>
        <button type="button" class="z-icon-btn z-icon-btn-tint" data-bs-dismiss="offcanvas" aria-label="Close">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
    </div>
    <div class="z-sheet-body">
        {% include 'meals/_reading_guide.html' %}
        <button type="button" class="btn btn-primary btn-lg w-100 mt-3" data-bs-dismiss="offcanvas">Got it</button>
    </div>
</div>
